name: Docker Build and Push
on:
    push:
        branches:
            - main
    pull_request:

jobs:
    build-and-push:
        name: Execute Build and Push
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Extract Docker image metadata
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ vars.DOCKER_USERNAME }}/website

            - name: Log in to Docker Hub
              if: github.event_name != 'pull_request'
              uses: docker/login-action@v4
              with:
                  username: ${{ vars.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Build and push Docker image
              uses: docker/build-push-action@v7
              with:
                  secrets: |
                      supabaseAnonKey=${{ secrets.SUPABASE_ANON_KEY }}
                      supabaseUrl=${{ secrets.SUPABASE_URL }}
                  build-args: |
                      PORT=${{ '3000' }}
                      BLOG_URL=${{ vars.BLOG_URL }}
                      PORTFOLIO_URL=${{ vars.PORTFOLIO_URL }}
                      HEADER_TITLE=${{ vars.HEADER_TITLE }}
                      HEADER_SUBTITLE=${{ vars.HEADER_SUBTITLE }}
                      COPYRIGHT_TEXT=${{ vars.COPYRIGHT_TEXT }}
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  annotations: ${{ steps.meta.outputs.annotations }}
                  provenance: true
                  sbom: true
