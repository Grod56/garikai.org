name: source check

on:
    push:
        branches: [main]
        paths:
            - "app/**"
            - "app-library/**"
            - "package.json"
            - ".github/workflows/source-check.yml"

jobs:
    source-check:
        name: Execute Source Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Run Installation
              run: npm ci

            - name: Run Source Check
              run: npm run check:src
